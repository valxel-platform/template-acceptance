# Runs the product's acceptance tests against a deployed environment.
#
#   repository_dispatch valxel-acceptance   the Valxel SDLC, once a feature's whole change set is
#                                           deployed to dev or staging: the feature's tests, every
#                                           test reaching a changed component (and @critical in
#                                           staging). Posts check run "acceptance / <feature> / <stage>".
#   schedule (nightly) / workflow_dispatch  the full regression against an environment, plus the
#                                           review: tests covered by another, slowest tests.
#
# Per environment (GitHub environments "dev" and "staging"): variables ACCEPTANCE_ENV (component
# URLs, for scheduled runs), GREETINGS_TOPIC-style topic names, ACCEPTANCE_KAFKA_BOOTSTRAP; secrets
# ACCEPTANCE_OIDC_CLIENT_SECRET (or ACCEPTANCE_TOKEN), ACCEPTANCE_KAFKA_PASSWORD. Test identities
# and data are synthetic; never point a run at production.
name: acceptance

on:
  repository_dispatch:
    types: [valxel-acceptance]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      stage: { description: "dev or staging", required: true, type: choice, options: [dev, staging] }
      grep: { description: "Tests to run (a tag regex); empty runs everything", required: false }

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.event.client_payload.check || inputs.stage || 'nightly' }}
  cancel-in-progress: false

jobs:
  run:
    name: ${{ github.event.client_payload.check || format('acceptance / regression / {0}', inputs.stage || 'staging') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ github.event.client_payload.stage || inputs.stage || 'staging' }}
    permissions:
      contents: write # the perf-baselines branch (journey load test)
      checks: write
    env:
      STAGE: ${{ github.event.client_payload.stage || inputs.stage || 'staging' }}
      FEATURE_ID: ${{ github.event.client_payload.feature_id }}
      CRITERIA: ${{ github.event.client_payload.criteria }}
      CHECK_NAME: ${{ github.event.client_payload.check }}
      HEAD_SHA: ${{ github.event.client_payload.sha || github.sha }}
      GREP: ${{ github.event.client_payload.grep || inputs.grep }}
      PROJECTS: ${{ github.event.client_payload.projects || 'api,ui' }}
      VALXEL_ENV: ${{ github.event.client_payload.env && toJSON(github.event.client_payload.env) || vars.ACCEPTANCE_ENV }}
      ACCEPTANCE_KAFKA_BOOTSTRAP: ${{ vars.ACCEPTANCE_KAFKA_BOOTSTRAP }}
      ACCEPTANCE_KAFKA_SASL_MECHANISM: ${{ vars.ACCEPTANCE_KAFKA_SASL_MECHANISM }}
      ACCEPTANCE_KAFKA_USERNAME: ${{ vars.ACCEPTANCE_KAFKA_USERNAME }}
      ACCEPTANCE_KAFKA_PASSWORD: ${{ secrets.ACCEPTANCE_KAFKA_PASSWORD }}
      ACCEPTANCE_OIDC_TOKEN_URL: ${{ vars.ACCEPTANCE_OIDC_TOKEN_URL }}
      ACCEPTANCE_OIDC_CLIENT_ID: ${{ vars.ACCEPTANCE_OIDC_CLIENT_ID }}
      ACCEPTANCE_OIDC_CLIENT_SECRET: ${{ secrets.ACCEPTANCE_OIDC_CLIENT_SECRET }}
      ACCEPTANCE_OIDC_SCOPE: ${{ vars.ACCEPTANCE_OIDC_SCOPE }}
      ACCEPTANCE_TOKEN: ${{ secrets.ACCEPTANCE_TOKEN }}
      GREETINGS_TOPIC: ${{ vars.GREETINGS_TOPIC }}
      BUDGET_S: ${{ vars.ACCEPTANCE_BUDGET_S || '600' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # The journey load test's settings (peak, staging share, budgets), when the change set needs it.
      PERF_SETTINGS: ${{ github.event.client_payload.perf_settings && toJSON(github.event.client_payload.perf_settings) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Browsers only when the change set has a web app.
      - if: ${{ contains(env.PROJECTS, 'ui') }}
        run: npx playwright install --with-deps chromium
      - name: Run the selected tests
        id: run
        run: |
          args=()
          IFS=',' read -ra projects <<< "$PROJECTS"
          for p in "${projects[@]}"; do args+=(--project "$p"); done
          if [ -n "$GREP" ]; then args+=(--grep "$GREP"); fi
          npx playwright test "${args[@]}" || echo "failed=true" >> "$GITHUB_OUTPUT"
      # Staging, when the change set needs it (perf_settings in the dispatch): the critical journeys
      # under load, at the product's peak scaled to staging, against the budget and the last pass.
      - name: Journey load test
        if: ${{ !cancelled() && env.STAGE == 'staging' && env.PERF_SETTINGS != '' && env.PERF_SETTINGS != 'null' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ env.HEAD_SHA }}
        run: |
          rps=$(python3 -c 'import json,os; s=json.loads(os.environ["PERF_SETTINGS"]) or {}; print(max(1, round((s.get("peak_rps") or 50) * (s.get("load_factor") or 0.1))))')
          budget=$(python3 -c 'import json,os; s=json.loads(os.environ["PERF_SETTINGS"]) or {}; print(json.dumps((s.get("budgets") or {}).get("api") or {}))')
          pct=$(python3 -c 'import json,os; s=json.loads(os.environ["PERF_SETTINGS"]) or {}; print(s.get("regression_pct") or 10)')
          mkdir -p reports out
          docker run --rm --network host --user "$(id -u)" -v "$PWD/perf:/perf:ro" -v "$PWD/out:/out" \
            -e VALXEL_ENV -e ACCEPTANCE_TOKEN -e TARGET_RPS=$rps -e SUMMARY=/out/journeys.json \
            grafana/k6:2.3.0 run --quiet /perf/journeys.js || true
          python3 perf/compare.py --kind api --run out/journeys.json --budget "$budget" --regression "$pct" \
            --baseline journeys.json --save-baseline journeys.json --result reports/performance.json || true
      - name: Report to the Valxel SDLC
        if: ${{ !cancelled() && env.CHECK_NAME != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run report
      - name: Review overlap and slow tests
        if: ${{ !cancelled() && env.CHECK_NAME == '' }}
        run: npm run review
      # Belt and braces: nothing that looks like a token leaves the runner, even if a test prints one.
      - name: Check the report holds no credentials
        id: clean
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$(find playwright-report reports -name '*.zip' 2>/dev/null)" ]; then
            echo "a trace is in the report; traces hold credentials and are off in CI"; exit 1
          fi
          for secret in "$ACCEPTANCE_TOKEN" "$ACCEPTANCE_OIDC_CLIENT_SECRET" "$ACCEPTANCE_KAFKA_PASSWORD"; do
            if [ -n "$secret" ] && grep -rqF -- "$secret" playwright-report reports 2>/dev/null; then
              echo "a credential is in the report"; exit 1
            fi
          done
          if grep -rqE 'Bearer [A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' playwright-report reports 2>/dev/null; then
            echo "a bearer token is in the report"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.clean.outcome == 'success' }}
        with:
          name: acceptance-report
          path: |
            playwright-report/
            reports/
          retention-days: 7
      - if: ${{ steps.run.outputs.failed == 'true' }}
        run: exit 1
